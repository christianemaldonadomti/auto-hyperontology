[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-hyperontology"
version = "0.4.0"
description = "Universal n-ary mathematical hyperontology RAG framework (Proto-AGI v4.0 Forensic + OEIS A320228 Ordinal-Cardinal Mixing) for local LLMs (Ollama)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Christian Efraín Maldonado-Sifuentes", email = "christianemaldonadomti@gmail.com" }
]
keywords = [
    "hyperontology", 
    "graphrag", 
    "hypergraph", 
    "rag", 
    "ollama", 
    "local-llm", 
    "proto-agi", 
    "ordinal-cardinal-mixing", 
    "knowledge-distillation"
]
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
autohyperonto = "auto_hyperontology.cli:main"
hyper-rag = "auto_hyperontology.cli:main"

[project.urls]
Homepage = "https://github.com/christianemaldonadomti/auto-hyperontology"
Repository = "https://github.com/christianemaldonadomti/auto-hyperontology.git"
Documentation = "https://github.com/christianemaldonadomti/auto-hyperontology#readme"
Author = "https://github.com/christianemaldonadomti"

[tool.setuptools]
packages = ["auto_hyperontology"]
